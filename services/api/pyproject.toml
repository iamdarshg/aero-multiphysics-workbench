[project]
name = "aeroworkbench-api"
version = "0.1.0"
description = "Lean analytical core and FastAPI boundary for Aero Multiphysics Workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
  "cadquery>=2.4,<3",
  "gmsh>=4.12,<5",
  "ross-rotordynamics>=2.3.0",
  "pybamm>=26.8.0.0",
  "casadi==3.7.2",
  "plotly<6",
  "openmdao>=3.45.1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["../../packages/core", "../../packages/geometry", "../../packages/semantics", "../../packages/materials", "../../packages/electrical", "../../packages/mesh", "../../packages/coupling", "../../packages/convergence", "../../packages/optimization", "../../packages/dynamics", "../../packages/thermal", "../../packages/envelope", "../../packages/turbomachinery", "../../packages/manufacturing", "../../packages/fluid_properties", "../../packages/airframe", "../../packages/mechanisms", "../../packages/propulsors", "../../packages/durability", "../../packages/aeroelasticity", "../../packages/system_dynamics", "../../packages/internal_flow", "../../packages/environmental", "../../packages/rom", "../../packages/tolerancing", "../../packages/experiment", "../../packages/turbulence", "../../packages/composites", "../../packages/meshing", "../../packages/vehicle_systems", "../../solvers", "../..", "."]
testpaths = ["../../tests/core", "../../tests/integration", "../../tests/physics", "../../tests/perf"]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["../../typings", "../../packages/core", "../../packages/geometry", "../../packages/semantics", "../../packages/materials", "../../packages/electrical", "../../packages/mesh", "../../packages/coupling", "../../packages/convergence", "../../packages/optimization", "../../packages/dynamics", "../../packages/thermal", "../../packages/envelope", "../../packages/manufacturing", "../../packages/fluid_properties", "../../packages/airframe", "../../packages/mechanisms", "../../packages/propulsors", "../../packages/durability", "../../packages/aeroelasticity", "../../packages/system_dynamics", "../../packages/internal_flow", "../../packages/environmental", "../../packages/rom", "../../packages/tolerancing", "../../packages/experiment", "../../packages/turbulence", "../../packages/composites", "../../packages/meshing", "../../packages/vehicle_systems", "../../solvers", "../..", "."]

# The coupling layer wraps untyped native libraries (OpenMDAO, preCICE) and is
# not part of the strict gate; imports of it resolve to Any for checked targets.
[[tool.mypy.overrides]]
module = ["aeroworkbench_coupling.*"]
follow_imports = "skip"

# scipy ships no type stubs; the LHS sampler is the only scipy use and is
# exercised by tests, so its imports resolve to Any rather than failing strict.
[[tool.mypy.overrides]]
module = ["scipy.*"]
ignore_missing_imports = true

[tool.uv]
package = false
