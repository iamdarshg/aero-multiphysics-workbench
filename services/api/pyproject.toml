[project]
name = "aeroworkbench-api"
version = "0.1.0"
description = "Lean analytical core and FastAPI boundary for Aero Multiphysics Workbench"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.17,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["../../packages/core", "../../packages/geometry", "../../packages/semantics", "../../packages/mesh", "../../packages/coupling", "../../packages/convergence", "../../packages/optimization", "../../solvers", "."]
testpaths = ["../../tests/core", "../../tests/integration", "../../tests/physics"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["../../packages/core", "."]

[tool.uv]
package = false
